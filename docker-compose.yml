# Local development only — Postgres for npm run dev / migrate / seed.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carnival
      POSTGRES_PASSWORD: carnival
      POSTGRES_DB: carnival_waiver
    volumes:
      - carnival_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnival -d carnival_waiver"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carnival_pg_data:
